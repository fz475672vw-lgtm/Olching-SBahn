<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S-Bahn Pullach</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1b1d21; --muted: #6b7280;
    --line: #e5e7eb; --sbahn: #408335; --late: #c2410c; --ok: #15803d; --cancel: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111317; --card: #1b1e24; --text: #eceef2; --muted: #9aa1ac;
            --line: #2a2e36; --late: #fb923c; --ok: #4ade80; --cancel: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo { height: 52px; width: auto; flex: none; }
  h1 { font-size: 1.4rem; margin: 0; }
  .sub { color: var(--muted); font-size: .9rem; margin: 2px 0 16px; }
  button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line);
           background: var(--card); color: var(--text); cursor: pointer; flex: none; }
  ul { list-style: none; margin: 0; padding: 0; background: var(--card);
       border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  li { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
       padding: 12px 14px; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  .badge { background: var(--sbahn); color: #fff; font-weight: 700; border-radius: 999px;
           padding: 2px 10px; font-size: .9rem; min-width: 44px; text-align: center; }
  .dest { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--muted); font-size: .85rem; }
  .time { text-align: right; }
  .mins { font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .late { color: var(--late); } .ontime { color: var(--ok); }
  .cancelled .dest, .cancelled .mins { text-decoration: line-through; color: var(--cancel); }
  .status { color: var(--muted); font-size: .85rem; margin-top: 12px; }
  .error { color: var(--cancel); }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <!-- Logo: zuerst lokale Datei neben dieser HTML, sonst Wappen von Wikimedia Commons, sonst ausblenden -->
      <img class="logo" id="logo" src="pullach-logo.svg" alt="Gemeinde Pullach i. Isartal">
      <h1>Pullach → München</h1>
    </div>
    <button id="refresh" type="button">Aktualisieren</button>
  </header>
  <p class="sub">S-Bahn-Abfahrten (S7 Richtung Harras / Hbf / Ostbahnhof)</p>
  <ul id="list"><li><span></span><span class="meta">Lade Abfahrten …</span><span></span></li></ul>
  <p class="status" id="status"></p>
</main>

<script>
// Logo mit Fallback-Kette
(() => {
  const img = document.getElementById("logo");
  const sources = [
    "pullach-logo.png",
    "https://commons.wikimedia.org/wiki/Special:FilePath/DEU_Pullach_im_Isartal_COA.svg",
  ];
  img.addEventListener("error", () => {
    const next = sources.shift();
    if (next) img.src = next; else img.remove();
  });
})();

// Ziele stadtauswärts (S7 Richtung Wolfratshausen) – diese werden ausgeblendet.
const OUTBOUND = ["höllriegelskreuth", "hoellriegelskreuth", "buchenhain", "baierbrunn",
                  "schäftlarn", "schaeftlarn", "ebenhausen", "icking", "wolfratshausen"];

// Station "Pullach" (nicht Höllriegelskreuth, das auch zu Pullach gehört)
const isPullach = name => /pullach/i.test(name || "") && !/höllriegel|hoellriegel/i.test(name || "");
const isToMunich = dest => !OUTBOUND.some(o => (dest || "").toLowerCase().includes(o));
const REFRESH_MS = 30000;

const listEl = document.getElementById("list");
const statusEl = document.getElementById("status");

function cacheGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function cacheSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

async function getJson(url) {
  const signal = AbortSignal.timeout ? AbortSignal.timeout(8000) : undefined;
  const r = await fetch(url, { headers: { Accept: "application/json" }, signal });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

// Die MVG erlaubt keine direkten Abfragen von fremden Seiten (CORS).
// Deshalb wird sie zusätzlich über öffentliche CORS-Proxys abgefragt.
const PROXIES = {
  direkt: u => u,
  "corsproxy.io": u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  "allorigins": u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  "codetabs": u => "https://api.codetabs.com/v1/proxy/?quest=" + encodeURIComponent(u),
};

// Quelle 1: MVG
async function fromMvg(wrap = u => u) {
  const base = "https://www.mvg.de/api/bgw-pt/v3";
  const get = u => getJson(wrap(u));
  let id = cacheGet("pullach-mvg-id");
  if (!id) {
    const locs = await get(base + "/locations?query=" + encodeURIComponent("Pullach"));
    const st = locs.find(l => l.type === "STATION" && isPullach(l.name));
    if (!st) throw new Error("Station nicht gefunden");
    id = st.globalId; cacheSet("pullach-mvg-id", id);
  }
  const deps = await get(base + "/departures?globalId=" + encodeURIComponent(id) +
                             "&limit=40&transportTypes=SBAHN");
  return deps.map(d => ({
    line: d.label,
    dest: d.destination,
    planned: d.plannedDepartureTime,
    actual: d.realtimeDepartureTime ?? d.plannedDepartureTime,
    delay: d.realtime ? (d.delayInMinutes ?? 0) : null,
    platform: d.platform,
    cancelled: !!d.cancelled,
  }));
}

// Quelle 2 (Fallback): DB über transport.rest
async function fromDb() {
  const base = "https://v6.db.transport.rest";
  let id = cacheGet("pullach-db-id");
  if (!id) {
    const locs = await getJson(base + "/locations?query=Pullach&results=5&addresses=false&poi=false");
    const st = locs.find(l => isPullach(l.name) && (l.type === "stop" || l.type === "station"));
    if (!st) throw new Error("Station nicht gefunden");
    id = st.id; cacheSet("pullach-db-id", id);
  }
  const p = "duration=90&results=40&suburban=true&nationalExpress=false&national=false" +
            "&regionalExpress=false&regional=false&bus=false&ferry=false&subway=false&tram=false&taxi=false";
  const res = await getJson(base + "/stops/" + id + "/departures?" + p);
  const deps = res.departures || res;
  return deps.map(d => ({
    line: d.line?.name?.replace(/\s+/g, "") || "S",
    dest: d.direction,
    planned: Date.parse(d.plannedWhen),
    actual: Date.parse(d.when || d.plannedWhen),
    delay: d.delay == null ? null : Math.round(d.delay / 60),
    platform: d.platform || d.plannedPlatform,
    cancelled: !!d.cancelled,
  }));
}

const fmt = ms => new Date(ms).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function render(deps, source) {
  const now = Date.now();
  const rows = deps
    .filter(d => isToMunich(d.dest) && d.actual > now - 60000)
    .sort((a, b) => a.actual - b.actual)
    .slice(0, 12);

  if (!rows.length) {
    listEl.innerHTML = '<li><span></span><span class="meta">Keine Abfahrten gefunden.</span><span></span></li>';
  } else {
    listEl.innerHTML = rows.map(d => {
      const mins = Math.max(0, Math.round((d.actual - now) / 60000));
      const delayTxt = d.cancelled ? "Fällt aus"
        : d.delay == null ? "planmäßig"
        : d.delay > 0 ? `+${d.delay} min` : "pünktlich";
      const delayCls = d.cancelled ? "" : d.delay > 0 ? "late" : d.delay === 0 ? "ontime" : "";
      return `<li class="${d.cancelled ? "cancelled" : ""}">
        <span class="badge">${esc(d.line)}</span>
        <div style="min-width:0">
          <div class="dest">${esc(d.dest)}</div>
          <div class="meta">${fmt(d.planned)}${d.platform ? " · Gleis " + esc(d.platform) : ""}
            · <span class="${delayCls}">${delayTxt}</span></div>
        </div>
        <div class="time"><div class="mins">${mins === 0 ? "jetzt" : mins + "′"}</div>
          <div class="meta">${fmt(d.actual)}</div></div>
      </li>`;
    }).join("");
  }
  statusEl.className = "status";
  statusEl.textContent = `Stand ${fmt(now)} · Quelle: ${source} · aktualisiert alle 30 s`;
}

const SOURCES = [
  ...Object.entries(PROXIES).map(([p, wrap]) => [`MVG (${p})`, () => fromMvg(wrap)]),
  ["DB (transport.rest)", fromDb],
];
let lastGood = 0; // zuletzt funktionierende Quelle zuerst probieren

async function load() {
  const errors = [];
  const order = [...SOURCES.slice(lastGood), ...SOURCES.slice(0, lastGood)];
  for (const [name, fn] of order) {
    try {
      const deps = await fn();
      if (!Array.isArray(deps)) throw new Error("unerwartete Antwort");
      render(deps, name);
      lastGood = SOURCES.findIndex(s => s[0] === name);
      return;
    } catch (e) { errors.push(`${name}: ${e.message}`); }
  }
  statusEl.className = "status error";
  statusEl.textContent = "Abfahrten konnten nicht geladen werden (" + errors.join("; ") + ").";
}

document.getElementById("refresh").addEventListener("click", load);
load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
